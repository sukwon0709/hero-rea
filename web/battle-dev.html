<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Battle Dev</title>
  <link rel="stylesheet" href="./src/style.css" />
  <style>
    body.battledev { display: flex; flex-direction: column; min-height: 100vh; }
    body.battledev #stage { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; padding: 8px; min-height: 0; }
    body.battledev canvas.game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
    body.battledev .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    body.battledev .tools select, body.battledev .tools input[type=number] { font: inherit; }
    body.battledev .tools input[type=number] { width: 7em; }
    body.battledev #log { font: 12px/1.4 monospace; color: var(--muted); max-height: 9em; overflow: auto; margin: 0; padding: 4px 8px; white-space: pre-wrap; }
  </style>
</head>
<body class="battledev">
  <header>
    <a href="./">← 삼국지영걸전 Web</a>
    <span>Battle dev harness (native mode battle scene)</span>
    <span class="tools">
      <select id="source" aria-label="Start from"><option value="-1">New game</option><option value="0">Save 1</option><option value="1">Save 2</option><option value="2">Save 3</option><option value="3">Save 4</option><option value="4">Save 5</option></select>
      <select id="chapter" aria-label="Chapter"></select>
      <select id="battle" aria-label="Battle"></select>
      <label>Seed <input id="seed" type="number" value="12345" /></label>
      <label><input id="closeup" type="checkbox" checked /> Close-ups</label>
      <label><input id="auto" type="checkbox" /> Autoplay</label>
      <button id="start" type="button">Start</button>
    </span>
  </header>
  <section id="picker" class="picker" hidden>
    <h2>Load your copy of the game</h2>
    <p>Game data is not included. Drop <b>Hero.zip</b> here, or choose it or the <b>GAME</b> folder. It is kept only in this browser.</p>
    <label class="btn">Choose Hero.zip<input type="file" data-kind="zip" accept=".zip" hidden /></label>
    <label class="btn">Choose GAME folder<input type="file" data-kind="dir" webkitdirectory hidden /></label>
    <p class="error"></p>
  </section>
  <div id="stage" hidden><canvas id="screen" class="game" width="640" height="480"></canvas></div>
  <pre id="log"></pre>
  <script type="module" src="./src/native/battle/dev/main.ts"></script>
</body>
</html>
